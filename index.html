<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<title>Grow with Jana</title>

</head>
<body style="margin:0;background:#0A0B09">
<div id="root"></div>
<style>
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;align-content:center;background:radial-gradient(ellipse 120% 70% at 50% 0%,#14200F 0,#070A06 55%,#050705 100%);color:#F1F2EC;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .sp-hi{position:absolute;top:calc(28px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:600 13px/1 "Outfit",system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#C6F432;opacity:0;animation:spFade .5s .9s ease forwards}
#splash .sp-plant{position:relative;width:min(42vw,180px,30vh);aspect-ratio:270/344;cursor:pointer;border:0;padding:0;background:none;outline:none;margin-top:-6vh}
#splash .sp-halo{position:absolute;left:50%;top:45%;width:190%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.4);background:radial-gradient(circle,rgba(198,244,50,.28),rgba(198,244,50,0) 62%);opacity:0;animation:spHalo 1s .85s ease forwards,spBreathe 3.4s 1.9s ease-in-out infinite;pointer-events:none}
#splash .sp-shadow{position:absolute;left:50%;bottom:-7%;width:78%;height:9%;margin-left:-39%;border-radius:50%;background:radial-gradient(ellipse,rgba(198,244,50,.35),rgba(198,244,50,0) 70%);opacity:0;transform:scale(.55);animation:spShadowIn .8s 1.25s cubic-bezier(.2,.8,.2,1) forwards,spShadowHover 3.4s 2.05s ease-in-out infinite}
#splash .sp-float{position:absolute;inset:0;animation:spLift .8s 1.25s cubic-bezier(.2,.9,.25,1.15) forwards,spHover 3.4s 2.05s ease-in-out infinite}
#splash svg.sp-logo{width:100%;height:100%;overflow:visible;animation:spDepth .8s 1.25s ease forwards}
#splash .sp-ink .g{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,0);stroke-width:1.4;animation:spInkG .5s .05s ease forwards}
#splash .sp-ink .sp-leaf{fill:rgba(198,244,50,0);stroke:rgba(198,244,50,0);stroke-width:1.4;animation:spInkL .6s .25s ease forwards}
#splash .sp-leaf{transform-box:view-box}
#splash .sp-leaf.l{transform-origin:284px 205px;animation:spInkL .3s .9s ease forwards,spSprout .6s .9s cubic-bezier(.3,1.7,.5,1) both,spSwayL 3.2s 1.9s ease-in-out infinite}
#splash .sp-leaf.r{transform-origin:288px 205px;animation:spInkL .3s 1s ease forwards,spSprout .65s 1s cubic-bezier(.3,1.7,.5,1) both,spSwayR 3.6s 2s ease-in-out infinite}
#splash .sp-plant.poke .sp-leaf.l{animation:spInkL 0s forwards,spPokeL .55s ease}
#splash .sp-plant.poke .sp-leaf.r{animation:spInkL 0s forwards,spPokeR .55s ease}
#splash .sp-coin{position:absolute;left:50%;top:6%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1A8,#F2C230 55%,#A8740A);color:#7A5205;display:grid;place-items:center;font:800 17px/1 system-ui,sans-serif;box-shadow:0 0 22px rgba(242,194,48,.6);pointer-events:none;opacity:0;animation:spCoin 1s cubic-bezier(.3,.6,.4,1) both}
#splash .sp-soil{position:relative;margin-top:46px;width:min(56vw,220px);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:spFade .4s 1s ease forwards}
#splash .sp-soil i{display:block;height:100%;width:8%;border-radius:4px;background:#C6F432;box-shadow:0 0 12px #C6F432;transition:width .7s cubic-bezier(.3,.7,.2,1)}
#splash[data-stage="1"] .sp-soil i{width:38%}
#splash[data-stage="2"] .sp-soil i{width:72%}
#splash[data-stage="3"] .sp-soil i{width:100%}
#splash .sp-msg{position:relative;margin-top:14px;min-height:20px;font-weight:600;font-size:14px;color:#C9CBC1;text-align:center;padding:0 24px;opacity:0;animation:spFade .4s 1.1s ease forwards}
#splash .sp-msg.swap{animation:spSwap .35s ease forwards}
#splash .sp-tip{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12.5px;font-weight:600;color:#8A8D83;opacity:0;animation:spFade .5s 2.8s ease forwards}
#splash .sp-retry{position:relative;display:none;margin:16px auto 0;padding:10px 20px;border:0;border-radius:999px;background:#C6F432;color:#0D0E0B;font-family:inherit;font-weight:700;font-size:14px;line-height:1;cursor:pointer}
#splash.err .sp-retry{display:block}
#splash.err .sp-msg{color:#FF7A66}
#splash.err .sp-soil i{background:#FF7A66;box-shadow:none}
#splash .sp-drop{transform-box:view-box;transform:translateY(-300px);animation:spDrop .75s .15s cubic-bezier(.45,0,.9,.6) forwards}
#splash .sp-spin{transform-box:fill-box;transform-origin:center;animation:spSpin .25s linear 3 .15s}
#splash .sp-ring{fill:none;stroke:#F2C230;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:spRingOut .6s .82s ease-out forwards}
@keyframes spDrop{0%{transform:translateY(-300px);opacity:1}70%{transform:translateY(0)}80%{transform:translateY(-18px) scale(1)}90%{transform:translateY(2px) scale(.9)}100%{transform:translateY(8px) scale(0);opacity:0}}
@keyframes spSpin{50%{transform:scaleX(.12)}}
@keyframes spRingOut{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(3.2);stroke-width:.5}}
@keyframes spSprout{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
@media (max-height:480px){#splash .sp-plant{margin-top:8vh;width:min(42vw,180px,26vh)}#splash .sp-hi{top:10px}#splash .sp-soil{margin-top:28px}}
@keyframes spInkG{to{fill:#FFFFFF;stroke:rgba(255,255,255,0)}}
@keyframes spInkL{to{fill:#C6F432;stroke:rgba(198,244,50,0)}}
@keyframes spLift{0%{transform:translateY(0) scale(.94)}100%{transform:translateY(-16px) scale(1)}}
@keyframes spHover{0%,100%{transform:translateY(-16px)}50%{transform:translateY(-26px)}}
@keyframes spDepth{to{filter:drop-shadow(0 16px 22px rgba(0,0,0,.7))}}
@keyframes spHalo{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes spBreathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes spShadowIn{to{opacity:1;transform:scale(1)}}
@keyframes spShadowHover{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
@keyframes spSwayL{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@keyframes spSwayR{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
@keyframes spPokeL{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08) rotate(-16deg)}65%{transform:scale(1) rotate(7deg)}}
@keyframes spPokeR{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08) rotate(14deg)}65%{transform:scale(1) rotate(-7deg)}}
@keyframes spCoin{0%{transform:translateY(0) scale(.3);opacity:0}25%{transform:translateY(-70px) scale(1.05);opacity:1}55%{transform:translateY(-82px) scale(1)}100%{transform:translateY(60px) scale(.5);opacity:0}}
@keyframes spFade{to{opacity:1}}
@keyframes spSwap{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-drop,#splash .sp-ring{display:none}#splash,#splash *{animation:none!important}#splash *{opacity:1}#splash .sp-coin{display:none}#splash .sp-ink .g{fill:#fff;stroke:none}#splash .sp-ink .sp-leaf{fill:#C6F432;stroke:none}}
</style>

          <clipPath id="sp-cg"><rect x="268" y="198.4" width="140" height="152"/><rect x="130" y="349.5" width="274" height="90"/></clipPath>

<script>
(function(){
  var el=document.getElementById('splash'),msg=document.getElementById('sp-msg'),plant=document.getElementById('sp-plant');
  var nightStop=function(){};
  var h=new Date().getHours();
  var t0=Date.now(),MIN=1800,gone=false;
  var say=function(t){if(msg.textContent===t)return;msg.textContent=t;msg.classList.remove('swap');void msg.offsetWidth;msg.classList.add('swap')};
  plant.addEventListener('click',function(){
    plant.classList.remove('poke');void plant.offsetWidth;plant.classList.add('poke');
    try{if(localStorage.getItem('gwj-sound')!=='off'){var A=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());A.resume&&A.resume();[[1568,0],[2349,.07],[1760,.16],[2637,.23]].forEach(function(n){var o=A.createOscillator(),g=A.createGain(),t=A.currentTime+n[1];o.type='triangle';o.frequency.value=n[0];g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.14,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(A.destination);o.start(t);o.stop(t+.32)})}}catch(e){}
    for(var k=0;k<3;k++)(function(k){var c=document.createElement('span');c.className='sp-coin';c.textContent='\u20B9';c.style.left=(26+k*24)+'%';c.style.animationDelay=(k*90)+'ms';plant.appendChild(c);setTimeout(function(){c.remove()},1400)})(k);
    if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  });
  window.__splash={
    stage:function(n,text){if(gone)return;el.classList.remove('err');el.setAttribute('data-stage',n);if(text)say(text)},
    error:function(text){if(gone)return;el.classList.add('err');say(text)},
    done:function(){
      if(gone)return;gone=true;el.setAttribute('data-stage','3');say('Ready');
      setTimeout(function(){el.classList.add('out');setTimeout(function(){nightStop();el.remove()},520)},Math.max(250,MIN-(Date.now()-t0)));
    }
  };
})();
</script>
